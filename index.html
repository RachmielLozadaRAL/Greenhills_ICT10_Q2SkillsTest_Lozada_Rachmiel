
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test</title>
    <!-- PyScript JavaScript -->
    <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>
    <!-- PyScript CSS -->
    <link href="https://pyscript.net/releases/2026.7.2/core.css" rel="stylesheet" />

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #183b52, #071522 75%);
            color: #e0f7fa;
        }

        .container {
            background: rgba(12, 35, 50, 0.9);
            padding: 40px;
            width: 320px;
            text-align: center;
            border: 1px solid #00e5ff;
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
        }

        h3 {
            color: #00e5ff;
            font-size: 23px;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-transform: uppercase;
            text-shadow: 0 0 12px #00bcd4;
        }

        input[type="text"] {
            width: 85%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #00bcd4;
            border-radius: 8px;
            background: #102b3d;
            color: white;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #80ffff;
            box-shadow: 0 0 12px #00e5ff;
        }

        input[type="button"] {
            padding: 12px 25px;
            background: linear-gradient(135deg, #00bcd4, #007c91);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="button"]:hover {
            background: linear-gradient(135deg, #80ffff, #00bcd4);
            color: #071522;
            box-shadow: 0 0 18px #00e5ff;
            transform: translateY(-2px);
        }

        #output {
            margin-top: 25px;
            padding: 15px;
            color: #80ffff;
            font-size: 17px;
            text-align: center;
        }

        /* Decorative science elements */
        .container::before {
            content: "⚛";
            display: block;
            font-size: 35px;
            color: #00e5ff;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #00e5ff;
        }

        body::after {
            content: "CHEMISTRY LABORATORY • ELEMENT IDENTIFICATION SYSTEM";
            position: fixed;
            bottom: 18px;
            font-size: 10px;
            letter-spacing: 2px;
            color: #527b8b;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Elemental Symbol Checker</h3>
        <input type="text" placeholder="Enter Symbol (e.g., H)" id="nonmetal"><br>
        <input type="button" py-click="check_symbol" value="Check Symbol">
    </div>
    <div id="output"></div>

    <py-script src="main.py"></py-script>
</body>
</html>
